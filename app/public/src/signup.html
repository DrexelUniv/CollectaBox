<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account Page</title>
    <link rel="stylesheet" type="text/css" href="../style/style.css">
</head>
<body>

<div class="page">
    <div class="logo-container">
        <img src="../images/collectabox-logo.png" alt="Website logo" class="logo">
    </div>

    <div class="form-container">
        <div class="form-group pfp-group">
            <label for="profile_pic">Profile Picture (optional):</label>
            <img id="pfp-preview" class="pfp-preview"
                 src="/images/profile_pic_blank.png" alt="Profile picture preview">
            <input id="profile_pic" type="file" name="profile_pic"
                   accept="image/png, image/jpeg, image/webp">
        </div>

        <div class="form-group">
            <label for="username">Username:</label>
            <input id="username" type="text" name="username">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input id="email" type="email" name="email">
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input id="password" type="password" name="password">
        </div>

        <div class="form-group">
            <label for="confirm">Confirm Password:</label>
            <input id="confirm" type="password" name="confirm">
        </div>

        <div id="message"></div>

        <button id="submit" type="button">Create Account</button>

        <p>Already have an account? Login <a href="login.html">here</a></p>
    </div>
</div>

<script src="../js/signup.js"></script>

</body>
</html>
